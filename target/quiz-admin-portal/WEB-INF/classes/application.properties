
server.port=9889
server.servlet.context-path=/

spring.application.name=quiz-admin-portal

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_admin_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JSP View Resolver ----------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ---------- File Upload (question attachments, bulk upload) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads/

# ---------- Logging ----------
logging.level.org.springframework=INFO
logging.level.com.quizapp=DEBUG
